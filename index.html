<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>smit-chat</title>
        <!-- Preload critical font -->
        <link rel="preload" href="/src/assets/fonts/Inter_28pt-Medium.woff2" as="font" type="font/woff2" crossorigin />
    </head>
    <body>
        <!-- Loading Screen - hiển thị ngay lập tức -->
        <div
            id="initial-loading"
            style="
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #030a06;
                z-index: 9999;
                overflow: hidden;
            ">
            <img
                src="/src/assets/images/home-bg.jpg"
                alt=""
                style="
                    position: absolute;
                    bottom: 0;
                    right: 0;
                    width: 100%;
                    height: 100vh;
                    object-fit: cover;
                    opacity: 0.6;
                    pointer-events: none;
                " />

            <!-- Content: Logo + Progress Bar -->
            <div
                style="
                    position: relative;
                    z-index: 10;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    gap: 52px;
                ">
                <!-- Logo -->
                <img src="/src/assets/images/register/logo-smit-chat.png" alt="Logo" style="height: 88px" />

                <!-- Progress Bar -->
                <div
                    style="
                        width: 200px;
                        height: 6px;
                        background: rgba(255, 255, 255, 0.2);
                        border-radius: 200px;
                        overflow: hidden;
                    ">
                    <div
                        id="loading-progress"
                        style="
                            width: 0%;
                            height: 100%;
                            background: linear-gradient(84deg, #d6fffe 0%, #9afefe 25%, #5cffa9 75%);
                            border-radius: 200px;
                            transition: width 0.3s ease;
                        "></div>
                </div>
            </div>
        </div>

        <style>
            /* Animate progress bar */
            @keyframes loading-progress {
                0% {
                    width: 0%;
                }
                100% {
                    width: 100%;
                }
            }
            #loading-progress {
                animation: loading-progress 2s ease-out forwards;
            }
        </style>

        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
